<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Аудиоверсия</title>
<style>
  :root {
    --paper: #faf5ee; --card: #fffdf9; --ink: #2e2824; --muted: #766a61; --line: #e7dccf;
    --accent: #c9683f; --soft: #f6e4d6; --s0: #c9683f; --s1: #3f6f73; --s2: #6b5b95; --s3: #8a6d1f;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--paper); color: var(--ink); font: 16px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  button { font: inherit; color: inherit; }
  .app { display: grid; grid-template-columns: minmax(0, 1fr) minmax(300px, 400px); height: 100%; }
  .stage { display: flex; flex-direction: column; gap: 20px; padding: 28px 32px; min-width: 0; min-height: 0; overflow: auto; }
  header { display: flex; align-items: baseline; gap: 12px; }
  h1 { margin: 0; font-size: 24px; line-height: 1.2; }
  .ep { color: var(--muted); font-size: 14px; }
  .shot { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px 20px; }
  .kicker { display: flex; justify-content: space-between; gap: 12px; color: var(--muted); font-size: 14px; }
  .framing { margin: 6px 0 2px; font-size: 20px; font-weight: 650; }
  .camera { margin: 0 0 8px; color: var(--muted); }
  .action, .sound { margin: 0; }
  .sound { margin-top: 4px; color: var(--muted); font-size: 14px; }
  .speech { flex: 1; display: flex; flex-direction: column; justify-content: center; min-height: 190px; padding: 8px 4px; }
  .who { font-size: 15px; font-weight: 700; min-height: 22px; }
  .text { margin: 6px 0; font-size: clamp(26px, 3.4vw, 40px); line-height: 1.2; font-weight: 600; text-wrap: balance; }
  .text.silent { color: var(--muted); font-weight: 400; font-size: 22px; }
  .how { margin: 0; min-height: 22px; color: var(--muted); }
  .transport { display: flex; align-items: center; gap: 14px; }
  .play { flex: none; width: 52px; height: 52px; border: 0; border-radius: 50%; background: var(--accent); color: #fff; font-size: 18px; cursor: pointer; }
  .time { flex: none; width: 92px; font-variant-numeric: tabular-nums; color: var(--muted); font-size: 14px; }
  .bar { position: relative; flex: 1; display: flex; gap: 1px; height: 28px; cursor: pointer; touch-action: none; border-radius: 4px; }
  .seg { height: 100%; min-width: 1px; background: var(--line); }
  .seg.scene-odd { background: #dccdbc; }
  .seg.done { background: #e9b597; }
  .seg.now { background: var(--accent); }
  .head { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--ink); pointer-events: none; }
  :focus-visible { outline: 2px solid var(--s1); outline-offset: 2px; }
  aside { border-left: 1px solid var(--line); background: var(--card); overflow-y: auto; min-height: 0; }
  .scene-title { position: sticky; top: 0; z-index: 1; padding: 10px 16px; background: var(--card); border-bottom: 1px solid var(--line); font-size: 13px; font-weight: 700; color: var(--muted); }
  .row { display: block; width: 100%; padding: 8px 16px; border: 0; border-bottom: 1px solid #f2eadf; background: none; text-align: left; cursor: pointer; }
  .row:hover { background: #fbf3ea; }
  .row.now { background: var(--soft); }
  .row-head { display: flex; gap: 8px; color: var(--muted); font-size: 13px; }
  .row-head b { color: var(--ink); font-weight: 650; }
  .row-line { display: block; margin-top: 2px; font-size: 14px; }
  .row-line b { font-weight: 650; }
  @media (max-width: 820px) {
    .app { grid-template-columns: 1fr; grid-template-rows: auto minmax(220px, 1fr); height: auto; min-height: 100%; }
    .stage { padding: 18px; overflow: visible; }
    aside { border-left: 0; border-top: 1px solid var(--line); max-height: 45vh; }
  }
</style>
</head>
<body>
<main class="app">
  <section class="stage">
    <header><h1 id="title"></h1><span class="ep" id="ep"></span></header>
    <div class="shot">
      <div class="kicker"><span id="scene"></span><span id="shotNo"></span></div>
      <p class="framing" id="framing"></p>
      <p class="camera" id="camera"></p>
      <p class="action" id="action"></p>
      <p class="sound" id="sound"></p>
    </div>
    <div class="speech">
      <div class="who" id="who"></div>
      <p class="text" id="text"></p>
      <p class="how" id="how"></p>
    </div>
    <div class="transport">
      <button class="play" id="play" aria-label="Воспроизвести">▶</button>
      <span class="time" id="time"></span>
      <div class="bar" id="bar" role="slider" tabindex="0" aria-label="Позиция" aria-valuemin="0"></div>
    </div>
  </section>
  <aside id="list" aria-label="Шоты"></aside>
</main>
<audio id="audio" preload="auto"></audio>
<script id="episode" type="application/json">__EPISODE_DATA__</script>
<script id="track" type="text/plain">__AUDIO_BASE64__</script>
<script>
const data = JSON.parse(document.getElementById("episode").textContent);
const $ = id => document.getElementById(id);
const audio = $("audio"), bar = $("bar"), list = $("list");
const colors = {};
Object.keys(data.speakers).forEach((k, i) => colors[k] = `var(--s${i % 4})`);
const clock = t => `${Math.floor(t / 60)}:${String(Math.floor(t % 60)).padStart(2, "0")}`;

const bin = atob($("track").textContent.trim());
const bytes = new Uint8Array(bin.length);
for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
audio.src = URL.createObjectURL(new Blob([bytes], { type: "audio/mp4" }));
$("track").remove();

document.title = `${data.title} · аудиоверсия`;
$("title").textContent = data.title;
$("ep").textContent = data.id;
bar.setAttribute("aria-valuemax", Math.round(data.duration));

const el = (tag, cls, text) => {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text !== undefined) n.textContent = text;
  return n;
};

const segs = data.shots.map(s => {
  const seg = el("div", "seg" + (s.scene % 2 ? " scene-odd" : ""));
  seg.style.flex = `${s.end - s.start} 1 0`;
  seg.title = `Шот ${s.id}: ${s.framing}`;
  bar.append(seg);
  return seg;
});
const head = el("div", "head");
bar.append(head);

let lastScene = -1;
const rows = data.shots.map(s => {
  if (s.scene !== lastScene) {
    lastScene = s.scene;
    const sc = data.scenes[s.scene];
    list.append(el("div", "scene-title", `Сцена ${s.scene + 1}: ${sc.title}${sc.setting ? ", " + sc.setting : ""}`));
  }
  const row = el("button", "row");
  const top = el("span", "row-head");
  top.append(el("b", "", `Шот ${s.id}`), el("span", "", s.framing));
  row.append(top);
  s.lines.forEach(l => {
    const line = el("span", "row-line");
    const name = el("b", "", `${data.speakers[l.who]}: `);
    name.style.color = colors[l.who];
    line.append(name, document.createTextNode(l.text));
    row.append(line);
  });
  row.addEventListener("click", () => seek(s.start + 0.001));
  list.append(row);
  return row;
});

const shotAt = t => {
  let i = data.shots.findIndex(s => t < s.end);
  return i < 0 ? data.shots.length - 1 : i;
};

let current = -1, spoken;
function showShot(i) {
  const s = data.shots[i], sc = data.scenes[s.scene];
  $("scene").textContent = `Сцена ${s.scene + 1}: ${sc.title}${sc.setting ? ", " + sc.setting : ""}`;
  $("shotNo").textContent = `Шот ${s.id}`;
  $("framing").textContent = s.framing;
  $("camera").textContent = s.camera;
  $("action").textContent = s.action;
  $("sound").textContent = s.sound ? `Звук: ${s.sound}` : "";
  segs.forEach((seg, n) => {
    seg.classList.toggle("done", n < i);
    seg.classList.toggle("now", n === i);
  });
  rows.forEach((r, n) => r.classList.toggle("now", n === i));
  rows[i].scrollIntoView({ block: "center", behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth" });
}

function showLine(l) {
  const who = $("who"), text = $("text");
  who.textContent = l ? data.speakers[l.who] : "";
  who.style.color = l ? colors[l.who] : "";
  text.textContent = l ? l.text : "Пауза";
  text.classList.toggle("silent", !l);
  $("how").textContent = l ? l.how : "";
}

function render() {
  const t = audio.currentTime || 0;
  const i = shotAt(t);
  if (i !== current) { current = i; showShot(i); }
  const l = data.shots[i].lines.find(x => t >= x.start && t < x.end) || null;
  if (l !== spoken) { spoken = l; showLine(l); }
  $("time").textContent = `${clock(t)} / ${clock(data.duration)}`;
  head.style.left = `${Math.min(100, t / data.duration * 100)}%`;
  bar.setAttribute("aria-valuenow", Math.round(t));
  bar.setAttribute("aria-valuetext", `${clock(t)}, шот ${data.shots[i].id}`);
}

function loop() {
  render();
  if (!audio.paused) requestAnimationFrame(loop);
}

function seek(t) {
  audio.currentTime = Math.max(0, Math.min(data.duration, t));
  render();
}

function toggle() {
  if (audio.paused) audio.play(); else audio.pause();
}

$("play").addEventListener("click", toggle);
audio.addEventListener("play", () => {
  $("play").textContent = "❚❚";
  $("play").setAttribute("aria-label", "Пауза");
  loop();
});
audio.addEventListener("pause", () => {
  $("play").textContent = "▶";
  $("play").setAttribute("aria-label", "Воспроизвести");
  render();
});
audio.addEventListener("seeked", render);

const fromPointer = e => {
  const r = bar.getBoundingClientRect();
  seek((e.clientX - r.left) / r.width * data.duration);
};
bar.addEventListener("pointerdown", e => {
  bar.setPointerCapture(e.pointerId);
  fromPointer(e);
});
bar.addEventListener("pointermove", e => {
  if (bar.hasPointerCapture(e.pointerId)) fromPointer(e);
});

addEventListener("keydown", e => {
  if (e.code === "Space") {
    if (e.target.tagName === "BUTTON") e.target.blur();
    e.preventDefault();
    toggle();
  } else if (e.code === "ArrowRight" || e.code === "ArrowLeft") {
    e.preventDefault();
    const t = audio.currentTime;
    const i = shotAt(t);
    if (e.code === "ArrowRight") seek(data.shots[Math.min(i + 1, data.shots.length - 1)].start + 0.001);
    else seek(data.shots[t - data.shots[i].start > 0.6 ? i : Math.max(i - 1, 0)].start + 0.001);
  }
});

render();
</script>
</body>
</html>
